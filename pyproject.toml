[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillport"
version = "0.1.0"
description = "Install one skill folder into Claude Code, Cursor, Codex and Copilot paths and catch copy drift."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillport = "skillport.cli:main"

[tool.setuptools.packages.find]
include = ["skillport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
